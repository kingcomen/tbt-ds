name: "📥 Intake"
description: "เก็บคำขอที่ยังไม่ผ่าน triage; ต้องเปลี่ยน Type หลัง triage"
title: "[Intake] "
labels: ["intake", "source:user", "verification:needs-info"]
body:
  - type: textarea
    id: source
    attributes:
      label: "ต้นทาง"
      description: "Permalink ของ Slack/message/monitor หรือผู้รายงาน"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "สรุปคำขอ"
      description: "สรุปด้วยคำของผู้เปิด ห้าม copy บทสนทนาทั้งก้อน"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "บริบท"
      description: "วัน เวลา environment/location/flow ที่เกี่ยวข้อง"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: "สถานะการยืนยัน"
      description: "Confirmed / Suspected / Needs information พร้อมที่มา"
    validations:
      required: true
  - type: textarea
    id: triage
    attributes:
      label: "เกณฑ์การคัดแยก"
      description: "ต้องรู้อะไรจึงเปลี่ยนเป็น Bug/Enhancement/Chore/Docs หรือปิด not planned"
    validations:
      required: true
